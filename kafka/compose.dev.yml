# Kafka de DESARROLLO LOCAL: un solo broker en modo KRaft (sin Zookeeper), suficiente para probar
# ms-campuslab-audit (y report) en el computador.
#
#   docker compose -f compose.dev.yml up -d
#   docker exec campuslab-kafka-dev /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
#
# El clúster del proyecto (Zookeeper x3 + Kafka x3 brokers + Kafka UI, ver README) va en compose.yml y
# todavía no está definido. Los tópicos se crean solos la primera vez que alguien los usa
# (bookings.events, etc.) con 3 particiones, como indica CONTEXT.md.

name: campuslab-kafka-dev

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: campuslab-kafka-dev
    ports:
      - "9092:9092"          # los microservicios se conectan a localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_NUM_PARTITIONS: 3
      # un solo broker: los tópicos internos no pueden replicarse
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_dev_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  kafka_dev_data:
