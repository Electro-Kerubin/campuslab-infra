# RabbitMQ de CampusLab (ec2-mq): clúster de 2 nodos + Management UI.
#
#   docker compose up -d
#   docker exec campuslab-rabbitmq-1 rabbitmqctl cluster_status     # deben verse los 2 nodos
#
#   Nodo 1: AMQP localhost:5672 · UI http://localhost:15672
#   Nodo 2: AMQP localhost:5673 · UI http://localhost:15673   (usuario/clave: ver .env.example)
#
# Los microservicios se conectan al nodo 1. Para que sigan funcionando si cae ese nodo, configurar
#   SPRING_RABBITMQ_ADDRESSES=localhost:5672,localhost:5673
#
# Nota sobre alta disponibilidad: las colas clásicas viven solo en el nodo donde se declaran; el
# espejado de colas clásicas se eliminó en RabbitMQ 4.0. Para replicar una cola entre los dos nodos
# hay que declararla de tipo QUORUM (ms-campuslab-mq-admin: "type": "QUORUM").

name: campuslab-mq

x-rabbitmq: &rabbitmq
  image: rabbitmq:4.0-management      # misma versión que ms-campuslab-notify/compose.yml
  environment: &rabbitmq-env
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-campuslab}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-campuslab}
    # La cookie de Erlang debe ser IDÉNTICA en todos los nodos; cambiarla fuera de desarrollo
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-campuslab-dev-cookie}
  networks:
    - campuslab-network
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s
  restart: unless-stopped

services:
  rabbitmq-1:
    <<: *rabbitmq
    container_name: campuslab-rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro

  rabbitmq-2:
    <<: *rabbitmq
    container_name: campuslab-rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"      # AMQP (5673 en el host)
      - "15673:15672"    # Management UI
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbitmq-1:
        condition: service_healthy

networks:
  campuslab-network:
    name: campuslab-network

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:
